name: Hello CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4   # check the marketplace for the latest major version

      - name: Say hello
        run: echo "Hello from GitHub Actions!"

      - name: Show what's in the repo
        run: ls -la