name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Cancel older runs of the same branch/PR when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  IMAGE_NAME: finsteady-api
  PROJECT_PATH: "FinSteady_API.csproj"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore FinSteady_API.sln

      - name: Build   (Release)
        run: dotnet build FinSteady_API.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test FinSteady_API.sln --configuration Release --no-build --verbosity normal

      - name: Publish
        if: github.event_name == 'push'
        run: dotnet publish  ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ./publish

      - name: Upload build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: finsteady-api
          path: ./publish
          retention-days: 7


  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore
        run: dotnet restore FinSteady_API.sln

      - name: Verify code formatting
        run: dotnet format ${{ env.PROJECT_PATH }} --verify-no-changes --verbosity diagnostic


  secret-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Gitleaks
      run: |
        curl -sSfL -o gitleaks.tar.gz \
          https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
        tar -xzf gitleaks.tar.gz gitleaks
        chmod +x gitleaks


    - name: Run Gitleaks (fail on findings)
      run: |
        ./gitleaks detect \
          --source . \
          --config .gitleaks.toml \
          --verbose \
          --redact \
          --exit-code 1


  # ---------------------------------------------------------------
  # 5. Dependency vulnerability scan
  # ---------------------------------------------------------------
  dependency-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore
      - name: Check for vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt
          if grep -q "has the following vulnerable packages" vuln-report.txt; then
            echo "::error::Vulnerable NuGet packages detected."
            exit 1
          fi

  # ---------------------------------------------------------------
  # 6. Trivy — dependency + filesystem vulnerability scan
  # ---------------------------------------------------------------
  trivy-scan:
      runs-on: ubuntu-latest
      needs: build
      steps:
      - uses: actions/checkout@v4

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'table'
